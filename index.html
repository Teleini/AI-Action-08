<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="menu" id="menu">
            <h1>贪吃蛇游戏</h1>
            <div class="mode-selection">
                <h2>选择游戏模式</h2>
                <button class="mode-btn" data-mode="beginner">小白模式</button>
                <button class="mode-btn" data-mode="expert">高手模式</button>
                <button class="mode-btn" data-mode="master">顶级玩家模式</button>
            </div>
            <div class="difficulty-info">
                <h3>难度说明：</h3>
                <p><strong>小白模式：</strong>5个等级，速度逐渐增加</p>
                <p><strong>高手模式：</strong>7个等级，速度更快，需要更多食物通关</p>
                <p><strong>顶级玩家模式：</strong>10个等级，极限速度，挑战极限</p>
            </div>
        </div>

        <div class="game-container" id="gameContainer" style="display: none;">
            <div class="game-header">
                <div class="info">
                    <span>模式: <span id="modeName"></span></span>
                    <span>等级: <span id="level">1</span></span>
                    <span>分数: <span id="score">0</span></span>
                    <span>目标: <span id="target">0</span></span>
                </div>
                <button class="btn" id="pauseBtn">暂停</button>
                <button class="btn" id="backBtn">返回菜单</button>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div class="controls">
                <p>使用方向键 ↑ ↓ ← → 控制蛇的移动</p>
                <p>空格键暂停/继续</p>
            </div>
        </div>

        <div class="game-over" id="gameOver" style="display: none;">
            <h2>游戏结束</h2>
            <p>最终分数: <span id="finalScore"></span></p>
            <p>达到等级: <span id="finalLevel"></span></p>
            <button class="btn" id="restartBtn">重新开始</button>
            <button class="btn" id="menuBtn">返回菜单</button>
        </div>

        <div class="level-up" id="levelUp" style="display: none;">
            <h2>恭喜！</h2>
            <p id="levelUpText"></p>
            <button class="btn" id="continueBtn">继续游戏</button>
        </div>

        <div class="victory" id="victory" style="display: none;">
            <h2>🎉 通关成功！🎉</h2>
            <p>你完成了所有等级！</p>
            <p>最终分数: <span id="victoryScore"></span></p>
            <button class="btn" id="victoryMenuBtn">返回菜单</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
